plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.smsbridge'
version = '0.1.0'

android {
  namespace "expo.modules.smsbridge"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // androidx.core (NotificationCompat, NotificationManagerCompat) and
  // expo-modules-core come transitively via the expo-module-gradle-plugin —
  // no pinned versions here so they always match the host SDK.
  testImplementation 'junit:junit:4.13.2'
}
